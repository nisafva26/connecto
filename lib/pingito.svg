<svg width="100%" height="100%" viewBox="0 0 100 100" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Pingito App Icon Source (Square)</title>
    
    <!-- Background: Deep Teal/Forest Green matching your app theme -->
    <!-- This rect is a perfect square, covering the entire 100x100 canvas -->
    <rect x="0" y="0" width="100" height="100" fill="#013233"/>
    
    <!-- White Accent Color Group (Ping Waves) -->
    <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
        
        <!-- Large Outer Ping Wave (Opacity 0.15) -->
        <circle cx="50" cy="50" r="45" opacity="0.15" />
        
        <!-- Medium Inner Ping Wave (Opacity 0.3) -->
        <circle cx="50" cy="50" r="30" opacity="0.3" />

    </g>
    
    <!-- Friend Silhouettes (The "Gathering" Aspect) -->
    <g fill="#FFFFFF">
        <!-- Center Head (Represents the user/host) -->
        <circle cx="50" cy="78" r="5"/>
        <rect x="47" y="83" width="6" height="3" rx="1" ry="1"/>

        <!-- Left Head -->
        <circle cx="38" cy="78" r="4"/>
        <rect x="36" y="82" width="4" height="2" rx="1" ry="1"/>

        <!-- Right Head -->
        <circle cx="62" cy="78" r="4"/>
        <rect x="60" y="82" width="4" height="2" rx="1" ry="1"/>
    </g>
    
    <!-- Location/Navigation Cursor (Fill is solid White) -->
    <g fill="#FFFFFF" transform="translate(50, 50) rotate(45)">
        <!-- Path for the cursor shape -->
        <path d="M 0 -30 L 15 15 L 0 5 L -15 15 Z" /> 
        <!-- Inner Circle at the center (color-keyed to the background for visual punch) -->
        <circle cx="0" cy="0" r="5" fill="#013233"/>
    </g>
    
</svg>